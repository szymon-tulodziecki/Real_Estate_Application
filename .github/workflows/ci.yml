name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install crm-admin dependencies
        working-directory: ./crm-admin
        run: npm ci

      # FIX: Apply the rollup fix to BOTH frontend and crm-admin
      - name: Fix Rollup binaries for Linux
        run: |
          echo "Fixing Rollup for frontend..."
          cd frontend && npm install --no-save @rollup/rollup-linux-x64-gnu || true
          echo "Fixing Rollup for crm-admin..."
          cd ../crm-admin && npm install --no-save @rollup/rollup-linux-x64-gnu || true

      - name: Fix lightningcss native modules for Linux
        run: |
          echo "Fixing lightningcss for frontend..."
          cd frontend && npm install --no-save lightningcss || true
          cd frontend && npm rebuild lightningcss || true
          echo "Fixing lightningcss for crm-admin..."
          cd ../crm-admin && npm install --no-save lightningcss || true
          cd ../crm-admin && npm rebuild lightningcss || true

      - name: Linting
        run: |
          echo "Linting backend..."
          cd backend && npm run lint || echo "No lint script in backend"
          echo "Linting frontend..."
          cd ../frontend && npm run lint
          echo "Linting crm-admin..."
          cd ../crm-admin && npm run lint

      - name: Build applications (Node 20 only)
        if: matrix.node-version == '20.x'
        run: |
          echo "Building frontend..."
          cd frontend && npm run build
          echo "Building crm-admin..."
          cd ../crm-admin && npm run build

      - name: Check backend syntax
        working-directory: ./backend
        run: node -c server.js