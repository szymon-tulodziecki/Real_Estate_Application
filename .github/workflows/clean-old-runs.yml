name: Clean Old Workflow Runs

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  clean-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete previous completed runs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.request('GET /repos/{owner}/{repo}/actions/runs', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: 'completed',
              per_page: 100
            });
            
            // Note: runs.workflow_runs contains the actual array
            for (const run of runs.workflow_runs.slice(1)) {
              console.log(`Deleting run ID: ${run.id}`);
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
            }
      - name: Continue with other steps if needed
        run: echo "Old runs cleaned, proceeding..."